<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            position: relative;
        }

        .topleft {
            position: absolute;
            top: -3px;
            left: 1px;
            font-size: 20px;
        }

        .topright {
            position: absolute;
            top: -3px;
            right: 1px;
            font-size: 20px;
        }

        .middle{
            position: absolute;
            top: 48%;
            left: 47%;
            font-size: 20px;
        }

        .middlebottom {
            position: absolute;
            bottom: 4px;
            left: 47%;
            font-size: 20px;
        }

        .middletop {
            position: absolute;
            top: -3px;
            left: 47%;
            font-size: 20px;
        }

        .bottomleft {
            position: absolute;
            bottom: 4px;
            left: 1px;
            font-size: 20px;
        }

        .bottomright {
            position: absolute;
            bottom: 4px;
            right: 1px;
            font-size: 20px;
        }
        .leftmiddle {
            position: absolute;
            top: 50%;
            left: 0px;
            font-size: 20px;
        }
        .rightmiddle {
            position: absolute;
            top: 50%;
            right: 0px;
            font-size: 20px;
        }

        img {
            width: 100%;
            height: auto;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="image.png" alt="Cinque Terre" width="1000" height="300">
        <div class="topleft">Aryan Jaggi</div>
        <div class="topright">Aryan Jaggi</div>
        <div class="middle">Aryan Jaggi</div>
        <div class="middletop">Aryan Jaggi</div>
        <div class="middlebottom">Aryan Jaggi</div>
        <div class="bottomleft">Aryan Jaggi</div>
        <div class="bottomright">Aryan Jaggi</div>
        <div class="leftmiddle">Aryan Jaggi</div>
        <div class="rightmiddle">Aryan Jaggi</div>
    </div>

</body>

</html>
