<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    div {
    width: 400px;
    height: 400px;
    background-color: rgb(67, 167, 220);
    transition: width 2s, height 1s, background-color 3s;
    }

    div:hover {
    width: 800px;
    height: 200px;
    background-color: rgb(190, 23, 23);
    }
    </style>
</head>
<body>
    <h1>Transition Property</h1>
    <div></div>
</body>
</html>
