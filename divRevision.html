<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivRevision</title>
    <style>
        .d1{
            height: 400px;
            width: 500px;
            border-radius: 10px;
            background-color: blue;
            position: relative;
            text-align: right;
        }
        .d2{
            
            height: 200px;
            width: 200px;
            border-radius: 10px;
            background-color: red;
            position: absolute;
            bottom: 0;
            left: 0;
            
        }
    </style>
</head>
<body>
    <h1>My Div</h1>
    <div class="d1">
        <h2>Div1</h2>
        <div class="d2"><h2>Div2</h2></div>
    </div>

</body>
</html>
